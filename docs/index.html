<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>朝のニュース</title>
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-48.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <p class="eyebrow" id="date">読み込み中…</p>
    <h1>朝のニュース</h1>
    <p class="meta" id="meta"></p>
  </header>

  <section class="stage" aria-label="ニュースキャスター">
    <div class="anchor-frame" aria-hidden="true">
      <div class="anchor-face" id="anchor-face">
        <img class="base" src="anchor/base.jpg" alt="">
        <img class="part" data-mouth="a" src="anchor/a.png" style="left:28.977%;top:37.946%;width:21.023%;height:13.616%" alt="">
        <img class="part" data-mouth="i" src="anchor/i.png" style="left:28.977%;top:37.946%;width:21.023%;height:13.616%" alt="">
        <img class="part" data-mouth="u" src="anchor/u.png" style="left:28.977%;top:37.946%;width:21.023%;height:13.616%" alt="">
        <img class="part" data-mouth="e" src="anchor/e.png" style="left:28.977%;top:37.946%;width:21.023%;height:13.616%" alt="">
        <img class="part" data-mouth="o" src="anchor/o.png" style="left:28.977%;top:37.946%;width:21.023%;height:13.616%" alt="">
        <img class="part blink" src="anchor/blink.png" style="left:24.432%;top:25.446%;width:31.250%;height:7.589%" alt="">
      </div>
    </div>
    <div class="caption" aria-live="off">
      <span class="caption-genre" id="cap-genre">朝のニュース</span>
      <p class="caption-text" id="cap-text">▶ を押すと、キャスターがニュースを読み上げます</p>
    </div>
    <small class="credit">キャスターはAIで生成した架空の人物です</small>
  </section>

  <section class="player" aria-label="プレーヤー">
    <button class="play" id="play" aria-label="再生" disabled>
      <svg viewBox="0 0 24 24" class="icon-play"><path d="M8 5v14l11-7z"/></svg>
      <svg viewBox="0 0 24 24" class="icon-pause"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
    <div class="player-body">
      <p class="now" id="now">全部聴く</p>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="再生位置">
      <div class="player-row">
        <span class="time" id="time">0:00 / 0:00</span>
        <div class="controls">
          <button class="ghost" id="prev" aria-label="前の記事">⏮</button>
          <button class="ghost" id="next" aria-label="次の記事">⏭</button>
          <button class="ghost rate" id="rate" aria-label="再生速度">1.0×</button>
        </div>
      </div>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </section>

  <nav class="tabs" id="tabs" aria-label="ジャンル"></nav>
  <main id="list"></main>
  <p class="empty" id="error" hidden></p>

  <script src="app.js"></script>
  <script src="anchor.js"></script>
</body>
</html>
