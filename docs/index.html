<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>朝のニュース</title>
  <meta name="theme-color" content="#f7f4ee">
  <meta name="color-scheme" content="light">
  <meta name="app-version" content="__V__">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-48.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=__V__">
</head>
<body>
  <header class="top reveal" style="--i:0">
    <p class="eyebrow" id="date">読み込み中…</p>
    <h1>朝のニュース</h1>
    <span class="rule" aria-hidden="true"></span>
    <p class="meta" id="meta"></p>
  </header>

  <section class="weather loading reveal" style="--i:1" id="weather" aria-label="福岡市の今日の天気">
    <div class="wx-head">
      <h2>福岡市の天気</h2>
      <span class="wx-source"></span>
    </div>
    <div class="wx-main">
      <span class="wx-icon" aria-hidden="true">🌡️</span>
      <div class="wx-hero">
        <div class="wx-now">--°</div>
        <div class="wx-now-label">現在の気温</div>
      </div>
      <div class="wx-summary">
        <p class="wx-text">天気を読み込み中…</p>
        <p class="wx-feel"></p>
      </div>
    </div>
    <div class="wx-tiles">
      <div class="wx-tile"><span class="wx-tile-label">最高気温</span><span class="wx-tile-value wx-max">--°</span></div>
      <div class="wx-tile"><span class="wx-tile-label">最低気温</span><span class="wx-tile-value wx-min">--°</span></div>
      <div class="wx-tile"><span class="wx-tile-label">降水確率</span><span class="wx-tile-value wx-pop">--%</span><span class="wx-tile-sub wx-pop-time"></span></div>
    </div>
    <p class="wx-pops"></p>
    <div class="wx-charts" tabindex="0" aria-label="今日の1時間ごとの気温と降水確率のグラフ。左右の矢印キーで時刻を移動">
      <p class="wx-chart-title">気温（1時間ごと）</p>
      <svg class="wx-temp-chart" aria-hidden="true"></svg>
      <p class="wx-chart-title">降水確率（1時間ごと）</p>
      <svg class="wx-pop-chart" aria-hidden="true"></svg>
      <div class="wx-cross" hidden></div>
      <div class="wx-tip" hidden></div>
    </div>
    <details class="wx-details">
      <summary>表で見る</summary>
      <table class="wx-table"><thead><tr><th>時刻</th><th>気温</th><th>降水確率</th></tr></thead><tbody></tbody></table>
    </details>
  </section>

  <section class="player reveal" style="--i:2" aria-label="プレーヤー">
    <button class="play" id="play" aria-label="再生" disabled>
      <svg viewBox="0 0 24 24" class="icon-play"><path d="M8 5v14l11-7z"/></svg>
      <svg viewBox="0 0 24 24" class="icon-pause"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
    <div class="player-body">
      <p class="now"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="now">全部聴く</span></p>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="再生位置">
      <div class="player-row">
        <span class="time" id="time">0:00 / 0:00</span>
        <div class="controls">
          <button class="ghost icon" id="prev" aria-label="前の記事"><svg viewBox="0 0 24 24"><path d="M7 6h2v12H7zM20 6v12l-9-6z"/></svg></button>
          <button class="ghost icon" id="next" aria-label="次の記事"><svg viewBox="0 0 24 24"><path d="M15 6h2v12h-2zM4 6v12l9-6z"/></svg></button>
          <button class="ghost rate" id="rate" aria-label="再生速度">1.0×</button>
        </div>
      </div>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </section>

  <nav class="tabs reveal" style="--i:3" id="tabs" aria-label="ジャンル"></nav>
  <main id="list"></main>
  <p class="empty" id="error" hidden></p>

  <script src="app.js?v=__V__"></script>
  <script src="weather.js?v=__V__"></script>
</body>
</html>
