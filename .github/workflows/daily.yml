name: 朝のニュース生成

on:
  schedule:
    - cron: "30 20 * * *"   # 毎日 5:30 JST（GitHubの遅延を見込んで6時前に開始）
  workflow_dispatch:         # Actions 画面から手動実行
  push:
    branches: [main]         # 改修を push したらすぐ反映

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build.py
      # スマホに古い見た目・処理が残らないよう、読み込むファイルに更新ごとの番号を付ける
      - run: sed -i "s/__V__/${GITHUB_SHA::7}-$(date +%s)/g" docs/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
