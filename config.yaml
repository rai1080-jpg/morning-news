# 朝のニュース設定
# ジャンルやフィードを追加・削除すると、次回の生成から反映されます。
#
# フィードの書き方
#   RSSがあるサイト     : { source: 名前, url: "RSSのURL" }
#   Googleニュース検索  : { google: "検索語 when:1d" }   ← when:1d は「直近1日」
#   オプション          : title_keywords（タイトルにいずれかの語を含む記事だけ残す）
#                         max_age_hours（何時間前までの記事を対象にするか）
#                         fetch_page: true（記事ページから要約文を取る）

# 読み上げ音声（edge-tts の音声名）
#   ja-JP-NanamiNeural（女性） / ja-JP-KeitaNeural（男性）
voice: ja-JP-NanamiNeural
rate: "+10%"          # 読み上げ速度（例: "+0%", "+20%"）

# 要約の最大文字数（目安）
summary_chars: 120

# タイトルにこれらの語を含む記事は除外（株価速報・写真ページなど）
exclude_title_words: [騰落, 買い需要, 目標株価, 株価ランキング, 株主優待, 画像・写真, 写真・画像, CROSSWORD, クロスワード, ENEOSトーナメント, 上位10社, HDなど, YouTubeチャンネル, 株式情報, 今の株価]

genres:
  - name: 総合・国内
    max_items: 5
    max_age_hours: 36
    feeds:
      - { source: NHK, url: "https://www.nhk.or.jp/rss/news/cat0.xml" }
      - { source: Yahoo!ニュース, url: "https://news.yahoo.co.jp/rss/topics/domestic.xml", fetch_page: true }
      - { source: NHK, url: "https://www.nhk.or.jp/rss/news/cat1.xml" }
      - { source: NHK, url: "https://www.nhk.or.jp/rss/news/cat4.xml" }

  - name: 経済・ビジネス
    max_items: 5
    max_age_hours: 36
    feeds:
      # 日経は公開RSSがないため、Googleニュース経由で取得
      - { source: 日本経済新聞, google: "site:nikkei.com (経済 OR 企業 OR 市場 OR 金融 OR 株価 OR 決算) when:1d" }
      - { source: NHK, url: "https://www.nhk.or.jp/rss/news/cat5.xml" }
      - { source: Yahoo!ニュース, url: "https://news.yahoo.co.jp/rss/topics/business.xml", fetch_page: true }
      - { source: ITmedia ビジネスオンライン, url: "https://rss.itmedia.co.jp/rss/2.0/business.xml" }

  - name: 注目企業
    max_items: 6
    max_age_hours: 168   # 企業ニュースは数が少ないので1週間分
    feeds:
      - { google: "ベルシステム24 when:7d", title_keywords: [ベルシステム24] }
      - { google: "トランスコスモス when:7d", title_keywords: [トランスコスモス, transcosmos] }
      - { google: "アルティウスリンク when:7d", title_keywords: [アルティウスリンク] }
      - { google: "ENEOS when:7d", title_keywords: [ENEOS] }
      - { google: "西部ガス when:7d", title_keywords: [西部ガス] }
      - { google: "エコア when:30d", title_keywords: [エコア], max_age_hours: 720 }

  - name: AI
    max_items: 5
    max_age_hours: 36
    feeds:
      - { source: ITmedia AI+, url: "https://rss.itmedia.co.jp/rss/2.0/aiplus.xml" }
      - { google: "生成AI OR 人工知能 when:1d", title_keywords: [AI, 人工知能, ChatGPT, Gemini, Claude, LLM] }

  - name: IT・科学
    max_items: 4
    max_age_hours: 48
    feeds:
      - { source: Yahoo!ニュース, url: "https://news.yahoo.co.jp/rss/topics/it.xml", fetch_page: true }
      - { source: ITmedia NEWS, url: "https://rss.itmedia.co.jp/rss/2.0/news_bursts.xml" }
      - { source: NHK, url: "https://www.nhk.or.jp/rss/news/cat3.xml" }
      - { source: Yahoo!ニュース, url: "https://news.yahoo.co.jp/rss/topics/science.xml", fetch_page: true }

  - name: コールセンター
    max_items: 4
    max_age_hours: 72
    title_keywords: [コールセンター, コンタクトセンター, カスタマーサポート, 問い合わせ窓口]
    exclude_domains: [lg.jp, go.jp, pando.life]
    feeds:
      - { google: "コールセンター OR コンタクトセンター when:3d" }
